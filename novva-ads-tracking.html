<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Novva ADS Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'League Spartan';
    src: url('Fonts/LeagueSpartan-Bold.otf') format('opentype');
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --preto: #0a0505;
    --bordo-escuro: #2b0b0e;
    --vermelho: #8a222e;
    --vermelho-vivo: #b92d3d;
    --laranja: #ff6a00;
    --laranja-escuro: #e85d00;
    --dourado: #f2c744;
    --verde: #1f9d55;
    --branco: #ffffff;
    --texto-suave: rgba(255,255,255,0.78);
    --texto-fraco: rgba(255,255,255,0.55);
    --borda-card: rgba(217,53,72,0.55);
    --fonte-titulo: 'League Spartan', 'Baloo 2', 'Segoe UI', sans-serif;
    --fonte-corpo: 'Roboto', 'Segoe UI', sans-serif;
    --radius: 18px;
    --space-sm: 13px;
    --space-md: 21px;
    --space-lg: 34px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(184,45,61,0.35), transparent 60%),
      linear-gradient(180deg,#3C0101 0%, #170608 45%, #0a0505 100%);
    background-attachment:fixed;
    color:var(--branco);
    font-family:var(--fonte-corpo);
    line-height:1.55;
  }
  h1,h2{font-family:var(--fonte-titulo);margin:0;line-height:1.15;}

  header{
    position:sticky; top:0; z-index:5;
    display:flex; flex-wrap:wrap; gap:12px 22px; align-items:baseline; justify-content:space-between;
    padding:20px 24px;
    background:rgba(18,2,4,0.82);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--borda-card);
  }
  header h1{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
  header .meta{font-size:12px;color:var(--texto-fraco);margin-top:4px;letter-spacing:0.02em;}
  header button{
    font-family:var(--fonte-titulo);
    background:var(--laranja); color:#fff; border:0; border-radius:12px;
    padding:10px 22px; font-weight:700; font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    cursor:pointer; box-shadow:0 10px 30px rgba(255,106,0,0.35);
  }
  header button:hover{background:var(--laranja-escuro);}
  header button:disabled{opacity:.5;cursor:default;box-shadow:none;}

  main{padding:32px 24px 64px;max-width:1180px;margin:0 auto;}

  .aviso{
    background:rgba(242,199,68,0.10);
    border:1px dashed rgba(242,199,68,0.55);
    color:var(--dourado);
    padding:14px 18px; border-radius:12px; font-size:13.5px; margin-bottom:26px;
  }

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:16px;margin-bottom:30px;}
  .kpi{
    background:linear-gradient(160deg, rgba(185,45,61,0.18), rgba(43,11,14,0.35));
    border:1.5px solid var(--borda-card);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .kpi .n{font-family:var(--fonte-titulo);font-size:30px;font-weight:800;line-height:1;}
  .kpi .l{font-size:11.5px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:0.06em;margin-top:8px;}

  section{
    background:rgba(139,34,46,0.10);
    border:1.5px solid var(--borda-card);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:24px;
  }
  section h2{
    font-size:14px;margin:0 0 16px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--dourado);font-weight:800;
  }
  canvas{max-width:100%;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .sec-head h2{margin:0;}
  .range{display:flex;gap:6px;}
  .range button{
    font-family:var(--fonte-titulo);
    background:transparent;color:var(--texto-suave);
    border:1px solid var(--borda-card);border-radius:8px;
    padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:0.03em;cursor:pointer;
  }
  .range button.on{background:var(--laranja);border-color:var(--laranja);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top;}
  th{color:var(--texto-fraco);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;}
  tbody tr:hover{background:rgba(255,255,255,.03);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}

  .bar-row{display:grid;grid-template-columns:56px 1fr 84px;gap:12px;align-items:center;margin:8px 0;font-size:13px;}
  .bar-row span:first-child{font-family:var(--fonte-titulo);font-weight:700;color:var(--texto-suave);}
  .bar{height:16px;background:linear-gradient(90deg,var(--vermelho-vivo),var(--laranja));border-radius:5px;min-width:2px;}
  .bar-row span:last-child{color:var(--texto-suave);text-align:right;}

  .scroll-x{overflow-x:auto;}
  .erro{color:#ff8a8a;}
  .vazio{color:var(--texto-fraco);}
  code{background:rgba(255,255,255,.10);padding:1px 6px;border-radius:5px;font-size:12px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>Novva ADS Tracking</h1>
    <div class="meta" id="meta">carregando…</div>
  </div>
  <button id="reload" type="button">Atualizar</button>
</header>

<main>
  <div class="aviso" id="config-aviso" hidden>
    Configure <code>SUPABASE_URL</code> e <code>SUPABASE_KEY</code> no topo deste arquivo
    (a mesma anon key usada no <code>index.html</code>) e rode o <code>SUPABASE.md</code> no projeto.
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="sec-head">
      <h2>Eventos por dia</h2>
      <div class="range" id="range-dia">
        <button type="button" data-d="7">7d</button>
        <button type="button" data-d="30" class="on">30d</button>
        <button type="button" data-d="90">90d</button>
      </div>
    </div>
    <canvas id="chart-dia" height="72"></canvas>
  </section>

  <section>
    <h2>Profundidade de rolagem (30 dias)</h2>
    <div id="rolagem"></div>
  </section>

  <section>
    <h2>Desempenho dos vídeos (30 dias)</h2>
    <div class="scroll-x"><table id="videos"></table></div>
  </section>

  <section>
    <h2>Origens de tráfego (30 dias)</h2>
    <div class="scroll-x"><table id="referrers"></table></div>
  </section>

  <section>
    <h2>Últimos eventos</h2>
    <div class="scroll-x"><table id="recentes"></table></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
  // ================== CONFIG ==================
  // Mesmos valores do bloco ANALYTICS do index.html.
  var SUPABASE_URL = 'https://nbhekjgbszyuuxrynzfo.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iaGVramdic3p5dXV4cnluemZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MzM0MDUsImV4cCI6MjA5MjMwOTQwNX0.d8f346ONCOHjr__C8RLmSJOFW0kZfqFkCGHmotwxiXc';  // anon — publica por design
  // ===========================================

  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return (n==null?0:n).toLocaleString('pt-BR'); };

  if (!SUPABASE_URL || !SUPABASE_KEY){
    $('config-aviso').hidden = false;
    $('meta').textContent = 'sem configuração';
    return;
  }

  function api(view, qs){
    var headers = { apikey: SUPABASE_KEY };
    if (/^eyJ/.test(SUPABASE_KEY)) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
    return fetch(SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/' + view + (qs ? '?' + qs : ''), {
      headers: headers
    }).then(function(r){ if(!r.ok) throw new Error(view + ' → ' + r.status); return r.json(); });
  }

  var chart, diaRows = [], diaDays = 30;

  function renderKpis(k){
    var items = [
      ['Page views', k.pageviews], ['Visitantes', k.visitantes], ['Sessões', k.sessoes],
      ['Initiate Checkout', k.initiate_checkout], ['Contato WhatsApp', k.contatos_whatsapp],
      ['Video plays', k.video_plays], ['Vídeos concluídos', k.video_completes]
    ];
    $('kpis').innerHTML = items.map(function(it){
      return '<div class="kpi"><div class="n">' + fmt(it[1]) + '</div><div class="l">' + it[0] + '</div></div>';
    }).join('');
  }

  function renderDia(rows, days){
    diaRows = rows || diaRows;
    diaDays = days || diaDays;
    var series = ['PageView','InitiateCheckout','VideoPlay','Contact'];
    var cores  = ['#b92d3d','#ff6a00','#f2c744','#1f9d55'];

    var corte = new Date(); corte.setDate(corte.getDate() - (diaDays - 1));
    var corteStr = corte.toISOString().slice(0,10);
    var dias = Array.from(new Set(diaRows.map(function(r){ return r.dia; })))
                    .filter(function(d){ return d >= corteStr; }).sort();

    var byKey = {};
    series.forEach(function(s){ byKey[s] = {}; });
    diaRows.forEach(function(r){ if (byKey[r.event]) byKey[r.event][r.dia] = r.total; });

    var data = {
      labels: dias.map(function(d){ return d.slice(8,10) + '/' + d.slice(5,7); }),
      datasets: series.map(function(s, i){
        return { label: s, data: dias.map(function(d){ return byKey[s][d] || 0; }),
          backgroundColor: cores[i], borderWidth: 0, stack: 'a',
          barPercentage: 1, categoryPercentage: 0.86 };
      })
    };
    var opts = { responsive:true, maintainAspectRatio:true,
      interaction:{ mode:'index', intersect:false },
      scales:{
        x:{ stacked:true, ticks:{ color:'#c9a9ac', maxRotation:0, autoSkip:true, maxTicksLimit:14 },
            grid:{ display:false } },
        y:{ stacked:true, beginAtZero:true, ticks:{ color:'#c9a9ac', precision:0 },
            grid:{ color:'rgba(255,255,255,.06)' } }
      },
      plugins:{ legend:{ position:'bottom', labels:{ color:'#e8d5d7', boxWidth:12, boxHeight:12, padding:14 } } } };
    if (chart) chart.destroy();
    chart = new Chart($('chart-dia'), { type:'bar', data:data, options:opts });
  }

  function renderRolagem(rows, pageviews){
    var max = Math.max.apply(null, rows.map(function(r){ return r.total; }).concat([1]));
    $('rolagem').innerHTML = rows.map(function(r){
      var w = (r.total / max * 100).toFixed(1);
      var pct = pageviews ? ' (' + (r.total / pageviews * 100).toFixed(0) + '%)' : '';
      return '<div class="bar-row"><span>' + r.percent + '%</span>' +
             '<span class="bar" style="width:' + w + '%"></span>' +
             '<span>' + fmt(r.total) + pct + '</span></div>';
    }).join('') || '<p class="vazio">sem dados</p>';
  }

  function table(el, cols, rows){
    var head = '<tr>' + cols.map(function(c){ return '<th class="' + (c.num?'num':'') + '">' + c.t + '</th>'; }).join('') + '</tr>';
    var body = rows.map(function(row){
      return '<tr>' + cols.map(function(c){
        var v = c.f ? c.f(row) : row[c.k];
        return '<td class="' + (c.num?'num':'') + '">' + (v==null?'':v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    el.innerHTML = head + (body || '<tr><td colspan="' + cols.length + '" class="vazio">sem dados</td></tr>');
  }

  function load(){
    $('reload').disabled = true;
    $('meta').textContent = 'atualizando…';
    Promise.all([
      api('v_kpis_30d'), api('v_eventos_por_dia'), api('v_rolagem'),
      api('v_videos'), api('v_referrers'), api('v_recentes')
    ]).then(function(res){
      var k = res[0][0] || {};
      renderKpis(k);
      renderDia(res[1], diaDays);
      renderRolagem(res[2], k.pageviews);
      table($('videos'),
        [{t:'Vídeo',k:'video'},{t:'Posição',k:'posicao'},{t:'Plays',k:'plays',num:1},
         {t:'25%',k:'p25',num:1},{t:'50%',k:'p50',num:1},{t:'75%',k:'p75',num:1},
         {t:'95%',k:'p95',num:1},{t:'Fim',k:'completes',num:1}], res[3]);
      table($('referrers'),
        [{t:'Origem',k:'origem'},{t:'Sessões',k:'sessoes',num:1}], res[4]);
      table($('recentes'),
        [{t:'Quando',f:function(r){ return new Date(r.created_at).toLocaleString('pt-BR'); }},
         {t:'Evento',k:'event'},
         {t:'Detalhe',f:function(r){ return r.props ? JSON.stringify(r.props) : ''; }},
         {t:'Página',k:'path'},{t:'Origem',k:'origem'}], res[5]);
      $('meta').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR') + ' · janela de 30 dias';
    }).catch(function(e){
      $('meta').innerHTML = '<span class="erro">erro: ' + e.message + '</span>';
    }).finally(function(){ $('reload').disabled = false; });
  }

  $('reload').addEventListener('click', load);
  $('range-dia').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    Array.prototype.forEach.call(this.children, function(c){ c.classList.toggle('on', c === b); });
    renderDia(null, parseInt(b.dataset.d, 10));
  });
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
