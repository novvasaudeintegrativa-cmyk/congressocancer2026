<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Novva ADS Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ef; --card:#ffffff; --linha:#e8e3dd; --track:#efe8e4;
    --ink:#2a2320; --soft:#857b74; --faint:#afa59d;
    --bordo:#8a222e; --bordo-vivo:#b92d3d;
    --tit:'League Spartan','Segoe UI',sans-serif;
    --corpo:'Roboto','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--corpo);line-height:1.5;}
  h1,h2{font-family:var(--tit);margin:0;}
  .ico{width:1em;height:1em;display:block;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ico.play{fill:#fff;stroke:#fff;stroke-width:1.5;}

  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 48px;}

  /* ---- Top bar ---- */
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto;}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:var(--bordo);color:#fff;display:flex;align-items:center;justify-content:center;}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
  .periods{display:flex;gap:5px;flex-wrap:wrap;}
  .periods button{
    font-family:var(--tit);font-weight:700;font-size:12px;letter-spacing:.02em;
    padding:6px 13px;border-radius:999px;cursor:pointer;
    background:#fff;border:1px solid var(--linha);color:var(--soft);
  }
  .periods button.on{background:var(--bordo);border-color:var(--bordo);color:#fff;}
  .rt{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:#fff;border:1px solid var(--linha);color:var(--soft);font-size:12px;font-weight:600;}
  .rt.on{border-color:var(--bordo);color:var(--bordo);}
  .rt .dot{width:7px;height:7px;border-radius:50%;background:var(--bordo);}
  .rt.on .dot{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .reload{width:36px;height:36px;border-radius:10px;border:none;background:var(--bordo);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .reload:disabled{opacity:.5;}

  /* ---- grid ---- */
  .toprow{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px;}
  .hero{background:var(--bordo);color:#fff;border-radius:18px;padding:22px 22px 20px;}
  .hero .lbl{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.78);}
  .hero .big{font-family:var(--tit);font-weight:800;font-size:46px;line-height:1;margin-top:7px;}
  .hero .delta{margin-top:9px;font-size:12.5px;color:rgba(255,255,255,.74);}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .kpi{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;}
  .kpi .l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);}
  .kpi .n{font-family:var(--tit);font-weight:800;font-size:26px;color:var(--ink);margin-top:5px;line-height:1;}
  .kpi .s{font-size:11px;color:var(--faint);margin-top:6px;}

  section{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
  .sec{display:inline-flex;align-items:center;gap:8px;font-family:var(--tit);font-weight:800;font-size:12px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--bordo);margin-bottom:16px;}
  .sec .bar{width:14px;height:2px;background:var(--bordo);border-radius:2px;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .sec-head .hint{font-size:11px;color:var(--faint);}
  canvas{max-width:100%;display:block;}

  .funil{display:flex;flex-direction:column;gap:13px;}
  .step{display:flex;flex-direction:column;gap:6px;}
  .step .row{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;}
  .step .row b{font-family:var(--tit);font-weight:800;}
  .step .row .pct{color:var(--soft);font-size:11.5px;font-weight:400;margin-left:4px;}
  .step .tk{height:6px;border-radius:4px;background:var(--track);overflow:hidden;}
  .step .tk i{display:block;height:100%;background:var(--bordo);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;padding:0 6px 9px 0;color:var(--faint);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.05em;}
  td{padding:9px 6px 9px 0;border-top:1px solid #f1eae3;color:var(--ink);}
  td.n,th.n{text-align:right;font-family:var(--tit);font-weight:700;}
  .scroll-x{overflow-x:auto;}
  .vazio{color:var(--faint);font-size:12px;}
  .foot{text-align:center;color:var(--faint);font-size:11px;margin-top:20px;}
  .erro{color:#a12; }
  code{background:#f1ece6;padding:1px 5px;border-radius:4px;font-size:11px;}

  @media (min-width:900px){
    .wrap{padding:28px 28px 56px;}
    .toprow{grid-template-columns:360px minmax(0,1fr);gap:18px;margin-bottom:18px;}
    .hero{display:flex;flex-direction:column;justify-content:center;}
    .hero .big{font-size:56px;}
    .rightcol{display:flex;flex-direction:column;gap:14px;}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    .cols section{margin-bottom:0;}
    .cols.full section{margin-bottom:0;}
    #sec-hora{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
</defs></svg>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="mark"><svg class="ico" style="width:17px;height:17px"><use href="#i-mark"/></svg></span>
      <h1>Novva ADS Tracking</h1>
    </div>
    <div class="periods" id="periods">
      <button type="button" data-p="hoje" class="on">Hoje</button>
      <button type="button" data-p="7">7d</button>
      <button type="button" data-p="14">14d</button>
      <button type="button" data-p="30">30d</button>
      <button type="button" data-p="45">45d</button>
      <button type="button" data-p="60">60d</button>
      <button type="button" data-p="90">90d</button>
    </div>
    <button type="button" class="rt" id="rt"><span class="dot"></span>Tempo real</button>
    <button type="button" class="reload" id="reload" aria-label="Atualizar"><svg class="ico" style="width:15px;height:15px"><use href="#i-refresh"/></svg></button>
  </div>

  <div class="toprow">
    <div class="hero">
      <div class="lbl" id="hero-lbl">Visitantes · hoje</div>
      <div class="big" id="hero-num">—</div>
      <div class="delta" id="hero-delta"></div>
    </div>
    <div class="rightcol">
      <div class="kpis" id="kpis"></div>
      <section style="margin-bottom:0;">
        <span class="sec"><span class="bar"></span>Page views por dia</span>
        <canvas id="spark" height="70"></canvas>
      </section>
    </div>
  </div>

  <div class="cols">
    <section id="sec-funil">
      <span class="sec"><span class="bar"></span>Funil · profundidade da página</span>
      <div class="funil" id="funil"></div>
    </section>
    <section id="sec-vsl">
      <span class="sec"><span class="bar"></span>VSL · retenção</span>
      <div class="funil" id="vsl"></div>
    </section>
    <section id="sec-camp">
      <span class="sec"><span class="bar"></span>Campanhas · UTM</span>
      <div class="scroll-x"><table id="camp"></table></div>
    </section>
    <section id="sec-geo">
      <span class="sec"><span class="bar"></span>Localização · sessões</span>
      <div class="funil" id="geo"></div>
    </section>
    <section id="sec-hora">
      <div class="sec-head">
        <span class="sec"><span class="bar"></span>Eventos por hora do dia</span>
        <span class="hint">eventos somados por faixa de hora</span>
      </div>
      <canvas id="hora" height="80"></canvas>
    </section>
  </div>

  <p class="foot" id="foot">carregando…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
  // ===== CONFIG (mesmos valores do index.html) =====
  var SUPABASE_URL = 'https://nbhekjgbszyuuxrynzfo.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iaGVramdic3p5dXV4cnluemZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MzM0MDUsImV4cCI6MjA5MjMwOTQwNX0.d8f346ONCOHjr__C8RLmSJOFW0kZfqFkCGHmotwxiXc';  // anon (legacy) — publica por design
  // ================================================

  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return (n==null?0:n).toLocaleString('pt-BR'); };
  var pct = function(n,base){ return base ? Math.round(n/base*100)+'%' : '—'; };
  var ymd = function(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

  var state = { period:'hoje', rt:false, timer:null, chartS:null, chartH:null };

  var LABEL = { hoje:'hoje', '7':'últimos 7 dias', '14':'últimos 14 dias', '30':'últimos 30 dias',
                '45':'últimos 45 dias', '60':'últimos 60 dias', '90':'últimos 90 dias' };

  function range(){
    var to = new Date(); to.setHours(0,0,0,0);
    var from = new Date(to);
    if (state.period !== 'hoje') from.setDate(from.getDate() - (parseInt(state.period,10) - 1));
    return { d_from: ymd(from), d_to: ymd(to) };
  }

  function rpc(fn, body){
    var h = { 'Content-Type':'application/json', apikey: SUPABASE_KEY };
    if (/^eyJ/.test(SUPABASE_KEY)) h.Authorization = 'Bearer ' + SUPABASE_KEY;  // JWT vai como Bearer; publishable so como apikey
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:h, body: JSON.stringify(body||{}) })
      .then(function(r){ if(!r.ok) throw new Error(fn + ' → ' + r.status); return r.json(); });
  }

  // ---- render helpers ----
  function step(titulo, valor, base){
    var w = base ? Math.max(2, valor/base*100) : 0;
    return '<div class="step"><div class="row"><span>' + titulo + '</span>' +
      '<span><b>' + fmt(valor) + '</b><span class="pct">' + pct(valor, base) + '</span></span></div>' +
      '<div class="tk"><i style="width:' + w + '%"></i></div></div>';
  }

  function renderKpis(k){
    var items = [['Checkouts',k.checkouts],['WhatsApp',k.whatsapp],['Page views',k.pageviews],['Video plays',k.video_plays]];
    $('kpis').innerHTML = items.map(function(it){
      return '<div class="kpi"><div class="l">' + it[0] + '</div><div class="n">' + fmt(it[1]) +
             '</div><div class="s">' + LABEL[state.period] + '</div></div>';
    }).join('');
  }

  function renderFunil(rows, base){
    var by = {}; (rows||[]).forEach(function(r){ by[r.percent] = r.total; });
    var h = step('Abriram a página', base||0, base||0);
    [25,50,75,90].forEach(function(p){ h += step('Rolaram ' + p + '%', by[p]||0, base||0); });
    $('funil').innerHTML = h;
  }

  function renderVsl(v){
    if (!v || !v.plays){ $('vsl').innerHTML = '<p class="vazio">Sem plays da VSL no período (entra quando o vídeo do Vturb rodar com <code>placement: \'vsl\'</code>).</p>'; return; }
    $('vsl').innerHTML =
      step('Deram play', v.plays, v.plays) +
      step('Assistiram 25%', v.p25, v.plays) +
      step('Assistiram 50%', v.p50, v.plays) +
      step('Assistiram 75%', v.p75, v.plays) +
      step('Assistiram 95%', v.p95, v.plays) +
      step('Concluíram', v.completes, v.plays);
  }

  function renderCamp(rows){
    if (!rows || !rows.length){
      $('camp').innerHTML = '<tbody><tr><td class="vazio" style="border:0;">Sem tráfego com <code>?utm_*</code> no período. Aparece quando as campanhas começarem.</td></tr></tbody>';
      return;
    }
    var head = '<thead><tr><th>Campanha</th><th>Origem</th><th class="n">Sess.</th><th class="n">Chk</th></tr></thead>';
    var body = rows.map(function(r){
      var org = [r.source, r.medium].filter(function(x){ return x; }).join(' · ') || '—';
      return '<tr><td>' + (r.campaign||'(sem campaign)') + '</td><td style="color:var(--soft)">' + org +
             '</td><td class="n">' + fmt(r.sessoes) + '</td><td class="n">' + fmt(r.checkouts) + '</td></tr>';
    }).join('');
    $('camp').innerHTML = head + '<tbody>' + body + '</tbody>';
  }

  function renderGeo(rows){
    var real = (rows||[]).filter(function(r){ return r.local && r.local !== '(sem local)'; });
    if (!real.length){
      $('geo').innerHTML = '<p class="vazio">Sem dados de localização ainda — requer captura de geo por IP no coletor (a implementar).</p>';
      return;
    }
    var max = real[0].sessoes || 1;
    $('geo').innerHTML = real.slice(0,8).map(function(r){
      return step(r.local, r.sessoes, max);
    }).join('');
  }

  function renderSpark(rows){
    var r = rows || [];
    var data = {
      labels: r.map(function(x){ return x.dia.slice(8,10) + '/' + x.dia.slice(5,7); }),
      datasets: [{ data: r.map(function(x){ return x.total; }),
        borderColor:'#8a222e', backgroundColor:'rgba(138,34,46,.07)', fill:true,
        tension:.35, pointRadius:0, borderWidth:2 }]
    };
    var opts = { responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:'#afa59d', maxTicksLimit:7, maxRotation:0 }, grid:{ display:false } },
               y:{ beginAtZero:true, ticks:{ color:'#afa59d', precision:0, maxTicksLimit:4 }, grid:{ color:'#f1eae3' } } } };
    if (state.chartS) state.chartS.destroy();
    state.chartS = new Chart($('spark'), { type:'line', data:data, options:opts });
  }

  function renderHora(rows){
    var by = {}; (rows||[]).forEach(function(r){ by[r.hora] = r.total; });
    var labels = [], vals = [];
    for (var h = 0; h < 24; h++){ labels.push(String(h).padStart(2,'0')); vals.push(by[h] || 0); }
    var opts = { responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:'#afa59d', maxRotation:0, autoSkip:false,
                     callback:function(v,i){ return (i%6===0||i===23) ? this.getLabelForValue(v) : ''; } },
                   grid:{ display:false } },
               y:{ beginAtZero:true, ticks:{ color:'#afa59d', precision:0, maxTicksLimit:4 }, grid:{ color:'#f1eae3' } } } };
    var data = { labels:labels, datasets:[{ data:vals, backgroundColor:'#8a222e', borderRadius:3, categoryPercentage:.82, barPercentage:1 }] };
    if (state.chartH) state.chartH.destroy();
    state.chartH = new Chart($('hora'), { type:'bar', data:data, options:opts });
  }

  function load(){
    $('reload').disabled = true;
    $('foot').textContent = 'atualizando…';
    $('hero-lbl').textContent = 'Visitantes · ' + LABEL[state.period];
    rpc('rpc_dashboard', range()).then(function(res){
      var d = Array.isArray(res) ? res[0] : res;
      var k = d.kpis || {};
      $('hero-num').textContent = fmt(k.visitantes);
      $('hero-delta').textContent = k.sessoes ? fmt(k.sessoes) + ' sessões · ' + fmt(k.pageviews) + ' page views' : '';
      renderKpis(k);
      renderSpark(d.pv_daily);
      renderFunil(d.funnel, k.pageviews);
      renderVsl(d.vsl);
      renderCamp(d.campaigns);
      renderGeo(d.geo);
      renderHora(d.by_hour);
      $('foot').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR') + ' · exibindo: ' + LABEL[state.period]
        + (state.rt ? ' · tempo real' : '');
    }).catch(function(e){
      $('foot').innerHTML = '<span class="erro">erro: ' + e.message + ' — rodou o bloco RPC do SUPABASE.md no Supabase?</span>';
    }).finally(function(){ $('reload').disabled = false; });
  }

  function applyRealtime(){
    if (state.timer){ clearInterval(state.timer); state.timer = null; }
    if (state.rt) state.timer = setInterval(load, 20000);
  }

  $('periods').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    Array.prototype.forEach.call(this.children, function(c){ c.classList.toggle('on', c === b); });
    state.period = b.dataset.p;
    load();
  });
  $('rt').addEventListener('click', function(){
    state.rt = !state.rt;
    this.classList.toggle('on', state.rt);
    if (state.rt){
      state.period = 'hoje';
      Array.prototype.forEach.call($('periods').children, function(c){ c.classList.toggle('on', c.dataset.p === 'hoje'); });
    }
    applyRealtime();
    load();
  });
  $('reload').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
